<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="leafGrad" x1="16" y1="40" x2="44" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="12" y1="46" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="50%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="32" y1="12" x2="32" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Golden Dawn / Sun of Enlightenment -->
  <circle cx="32" cy="18" r="7" fill="url(#sunGrad)" filter="url(#glow)" />
  <circle cx="32" cy="18" r="10" stroke="#FDE047" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="2 3" />

  <!-- Central Stem -->
  <path d="M32 46 C32 38 32 30 32 24" stroke="#059669" stroke-width="2.5" stroke-linecap="round" />

  <!-- Left Sprout Leaf (Thulir) -->
  <path d="M32 34 C24 33 16 26 19 18 C26 17 31 25 32 34 Z" fill="url(#leafGrad)" />
  <!-- Left Leaf Vein -->
  <path d="M22 23 C26 27 29 30 32 32" stroke="#A7F3D0" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Right Sprout Leaf (Tender New Shoot) -->
  <path d="M32 29 C38 27 46 21 44 14 C37 13 33 21 32 29 Z" fill="url(#leafGrad)" />
  <!-- Right Leaf Vein -->
  <path d="M41 18 C38 22 35 25 32 28" stroke="#A7F3D0" stroke-width="0.8" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Open Book Base (Foundation of Education) -->
  <!-- Left Page -->
  <path d="M32 46 C24 43 14 44 10 47 C10 49.5 11 54 11 54 C16 51 25 50.5 32 53 Z" fill="url(#bookGrad)" />
  <!-- Right Page -->
  <path d="M32 46 C40 43 50 44 54 47 C54 49.5 53 54 53 54 C48 51 39 50.5 32 53 Z" fill="url(#bookGrad)" />
  <!-- Center Book Spine / Ribbon -->
  <path d="M32 46 V55" stroke="#042F2E" stroke-width="2" stroke-linecap="round" />
  <circle cx="32" cy="46" r="1.5" fill="#34D399" />
</svg>

