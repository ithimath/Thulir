[project]
name = "thulir-backend"
version = "0.1.0"
description = "THULIR: Student Early-Warning & Support System Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "openpyxl>=3.1.5",
    "bcrypt>=4.2.1",
    "python-multipart>=0.0.20",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

